# md-coworker 的反向代理片段（独立子域示例）
#
# 用法：把下面的 server { } 放进 nginx 的 http { } 里，例如
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/md-coworker.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 为什么建议单独一个子域（如 cowork.example.com）：会话 Cookie mc_sid 是同源共享的
# （Path=/，HttpOnly; SameSite=Lax）。如果和 WordPress 之类的同源应用挤在同一个域下，
# 任何一处同源 XSS 都能带着这个 Cookie 去调本服务的 /api/*——HttpOnly 只挡读取，不挡使用。
#
# 本文件里的占位符：server_name、ssl_certificate*、以及后端端口（对应 systemd 单元的 --bind）。

# 80 端口只做跳转（用 certbot 的话它会自己维护 challenge 路径）
server {
    listen      80;
    listen      [::]:80;
    server_name cowork.example.com;          # ← 占位符：换成你的子域

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                          # nginx < 1.25.1 时改用 listen 443 ssl http2;
    server_name cowork.example.com;          # ← 占位符：换成你的子域

    # ← 占位符：证书路径（示例为 certbot 的默认布局）
    ssl_certificate     /etc/letsencrypt/live/cowork.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cowork.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:md_coworker_ssl:10m;
    ssl_session_timeout 1d;

    # 上传上限：后端默认 10 MiB（settings.max_upload_bytes，管理员可调到 512 MiB）。
    # 这里必须 ≥ 后端当前设置，否则大文件在反代层就被 413 掉。
    client_max_body_size 32m;

    # 上传是「流式写入临时文件、超限即中断」的，别让 nginx 先把整个请求体缓存到磁盘
    proxy_request_buffering off;

    # 其余请求全部交给后端（前端产物也由后端直接从 web/dist 提供，SPA 回退 index.html）
    location / {
        proxy_pass http://127.0.0.1:3001;    # ← 占位符：与 systemd 单元的 --bind 一致
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 必须写：后端只在看到 X-Forwarded-Proto: https（或自己带 --secure-cookies）时
        # 才给 mc_sid 加 Secure，漏了这条会话 Cookie 就会以明文形式下发
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 协作 WebSocket 端点。presence 心跳约 1s 一次，读超时必须远大于它，
    # 否则空闲一会儿连接就被 nginx 掐断（前端表现为反复重连）。
    # 另外 /ws 握手会校验 Origin 与 Host 一致，所以 Host 头同样不能省。
    location /ws {
        proxy_pass http://127.0.0.1:3001;    # ← 占位符：同上
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # —— 子路径部署（需 v0.2 起提供 --base-path）——
    # 想把整站挂到 https://example.com/cowork/ 下时，改用一个前缀 location：
    #   location /cowork/ {
    #       proxy_pass http://127.0.0.1:3001/;      # 末尾斜杠用于剥掉 /cowork 前缀
    #       ... 同样的 proxy_set_header
    #   }
    # 同时给后端加 --base-path /cowork（Cookie 的 Path 会跟着变成 /cowork，前端资源前缀同理），
    # WebSocket 随之变成 /cowork/ws；location /cowork/ 与 location / 不要重复配置。
    #
    # —— 前端走 CDN / 由 nginx 直出静态资源（可选，不在这里启用）——
    # 保留 location / 反代 /api 与 /ws，另外把 web/dist 直出，例如：
    #   location /assets/ { root /srv/md-coworker/web/dist; expires 7d; add_header Cache-Control "public, immutable"; }
    # 注意：index.html 不能设长缓存（SPA 回退依赖它）；且 CDN/静态域必须与本站同源——
    # 本项目没有跨域 API，跨源会拿不到 Cookie，登录态直接失效。
}
