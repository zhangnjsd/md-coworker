[package]
name = "md-coworker"
version = "0.2.0"
edition = "2024"
description = "Real-time collaborative Markdown workspace built on Axum + Yjs CRDT"
license = "MIT"

[dependencies]
# --- web framework ---
anyhow = "1"
axum = { version = "0.8", features = ["ws", "json", "tokio", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "compression-br"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- CRDT (Yjs compatible) ---
yrs = "0.28"

# --- crypto ---
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
aes-gcm = "0.11"
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
base64 = "0.23"
rand = "0.10"

# --- storage (PostgreSQL) ---
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
] }

# --- misc ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3.34"

[profile.release]
opt-level = 2
strip = "debuginfo"
